<svg viewBox="0 0 1200 300" role="img" aria-label="A flame graph mixing systems and team work, with the team path in red" xmlns="http://www.w3.org/2000/svg"><style>:root{--paper:#fafafa;--dot:#e8e8e8;--ink:#3d3d3d;--strong:#141414;--muted:#767676;--rule:#e4e4e4;--red:#d42a1e;
--line:#b4b4b4;--f1:#e9e9e9;--f2:#dedede;--f3:#d2d2d2;--r1:#f7dcd9;--r2:#f1c6c1;--r3:#eab0a9;--g1:#ececec;--g2:#e0e0e0;--g3:#d3d3d3;--lane:#9a9a9a;--sel:#fbe4e1;--head:#ececec;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}@media (prefers-color-scheme:dark){:root{--paper:#0f0f0f;--dot:#232323;--ink:#c6c6c6;--strong:#f4f4f4;--muted:#8e8e8e;--rule:#242424;--red:#ff6a5a;--line:#4a4a4a;--r1:#3a1d1a;--r2:#4a2320;--r3:#5a2a25;--g1:#232323;--g2:#2b2b2b;--g3:#343434;--lane:#6a6a6a;--sel:#301a17;--head:#1f1f1f;--f1:#1f1f1f;--f2:#262626;--f3:#2e2e2e;color-scheme:dark}}.b-bg{fill:none}.b-line{stroke:var(--line)}.b-line2{stroke:var(--muted)}.b-node{fill:var(--muted)}.b-red{stroke:var(--red)}.b-redf{fill:var(--red)}.b-grid{stroke:var(--rule);stroke-width:1}.b-lab{font:400 20px var(--mono);fill:var(--muted)}.b-labr{font:500 20px var(--mono);fill:var(--red)}.b-f1{fill:var(--f1)}.b-f2{fill:var(--f2)}.b-f3{fill:var(--f3)}.b-hot{fill:var(--red)}.b-ftxt{font:400 17px var(--mono);fill:var(--ink)}.b-ftxth{font:500 17px var(--mono);fill:var(--paper)}.fg-ui{font:400 15px var(--mono);fill:var(--muted)}.fg-title{font:600 17px var(--sans);fill:var(--strong)}.fg-g1{fill:var(--g1)}.fg-g2{fill:var(--g2)}.fg-g3{fill:var(--g3)}.fg-r1{fill:var(--r1)}.fg-r2{fill:var(--r2)}.fg-r3{fill:var(--r3)}.fg-hot{fill:var(--red)}.fg-txt{font:400 15px var(--mono);fill:var(--ink)}.fg-txth{font:500 15px var(--mono);fill:var(--paper)}.tr-grid{stroke:var(--rule);stroke-width:1}.tr-ax{font:400 14px var(--mono);fill:var(--muted)}.tr-svc{font:400 15px var(--mono);fill:var(--muted)}.tr-op{font:500 15px var(--mono);fill:var(--strong)}.tr-span{fill:var(--g3)}.tr-crit{fill:var(--red)}.tr-dur{font:400 13px var(--mono);fill:var(--muted)}.tp-dim{font:400 16px var(--mono);fill:var(--muted)}.tp-head{fill:var(--head)}.tp-h{font:600 15px var(--mono);fill:var(--strong)}.tp-row{font:400 16px var(--mono);fill:var(--ink)}.tp-hot{font:500 16px var(--mono);fill:var(--red)}.tp-cmd{font:500 16px var(--mono);fill:var(--strong)}.tp-cmdh{font:600 16px var(--mono);fill:var(--red)}.tp-sel{fill:var(--sel)}.tp-track{fill:var(--g1)}.tp-bar{fill:var(--g3)}.tp-barh{fill:var(--red)}.gt-main{stroke:var(--red);stroke-width:3.5}.gt-sys,.gt-ppl{stroke:var(--lane);stroke-width:2}.gt-ppl{stroke-dasharray:0}.gt-dm{fill:var(--paper);stroke:var(--red);stroke-width:3}.gt-ds,.gt-dp{fill:var(--paper);stroke:var(--lane);stroke-width:2}.gt-l{font:400 15px var(--mono);fill:var(--ink)}.gt-b{font:400 15px var(--mono);fill:var(--muted)}.gt-bm{font:600 15px var(--mono);fill:var(--red)}.gt-tag{fill:var(--red)}.gt-tagt{font:600 14px var(--mono);fill:var(--paper)}svg{background:var(--paper)}</style><rect width="1200" height="300" class="b-bg"/><rect x="40.0" y="224" width="1117.0" height="35" class="b-hot"/><text x="48.0" y="248" class="b-ftxth">main</text><rect x="40.0" y="186" width="579.4" height="35" class="b-f3"/><text x="48.0" y="210" class="b-ftxt">systems</text><rect x="633.6" y="186" width="523.4" height="35" class="b-hot"/><text x="641.6" y="210" class="b-ftxth">teams</text><rect x="40.0" y="148" width="221.0" height="35" class="b-f1"/><text x="48.0" y="172" class="b-ftxt">latency</text><rect x="275.2" y="148" width="209.8" height="35" class="b-f1"/><text x="283.2" y="172" class="b-ftxt">throughput</text><rect x="499.2" y="148" width="120.2" height="35" class="b-f2"/><text x="507.2" y="172" class="b-ftxt">io</text><rect x="633.6" y="148" width="165.0" height="35" class="b-f3"/><text x="641.6" y="172" class="b-ftxt">hiring</text><rect x="812.8" y="148" width="209.8" height="35" class="b-hot"/><text x="820.8" y="172" class="b-ftxth">trust</text><rect x="1036.8" y="148" width="120.2" height="35" class="b-f1"/><text x="1044.8" y="172" class="b-ftxt">1:1s</text><rect x="40.0" y="110" width="97.8" height="35" class="b-f3"/><text x="48.0" y="134" class="b-ftxt">gc</text><rect x="152.0" y="110" width="109.0" height="35" class="b-f3"/><text x="160.0" y="134" class="b-ftxt">locks</